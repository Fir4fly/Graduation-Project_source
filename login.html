<!DOCTYPE html>
<!-- ヘッダー -->
<head>
	<meta charset="UTF-8">
    <title>Login</title>
	<style>
		body{
		    background-color: rgb(189, 244, 189);
		    color: gray;
		}

		h1{
		    color: lightblue;
		    text-shadow: 0 0 10px rgba(0, 128, 255, 0.8);
			font-size: 48px;
			-webkit-text-stroke: 1.5px black;
		}
		
		.form{
			display: flex;
			flex-direction: column;
		}
		
		.formtext{
			color: black;
			margin-right: 240px;
			margin-bottom: 6px;
		}
		
		.textbox{
		    background-color: lightblue;
		    border: 1px solid black;
		    color: black;
		    padding: 10px;
		    font-size: 16px;
		    border-radius: 5px;
		    width: 300px;
		    text-align: center;
		    outline: none;
		    margin-bottom: 10px;
		}

		.button-login{
			width: 100px;
			background-color: lightblue;
			color: black;
			border: 1px solid black;
			padding: 5px 10px;
			margin-top: 15px;
			font-weight: bold;
			cursor: pointer;
			transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
            /* 修正点1: 枠線に丸みを持たせる */
            border-radius: 8px;
		}
		.button-login:hover {
			background-color: rgb(0, 128, 255); 
            color: whitesmoke; 
            transform: translateY(-2px); 
            box-shadow: 0 0 10px rgb(0, 128, 255, 0.8);
		}
		
		.button-newlogin{
			width: 100px;
			background-color: lightcoral;
			color: black;
			border: 1px solid black;
			padding: 5px 10px;
			font-weight: bold;
			cursor: pointer;
			transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
            /* 修正点1: 枠線に丸みを持たせる */
            border-radius: 8px;
		}
		
		.button-newlogin:hover{
			background-color: orangered; 
            color: whitesmoke; 
            transform: translateY(-2px); 
            box-shadow: 0 0 10px orangered;
		}

		.margin {
		    margin-top: 15px;
		}
		
		.error-message{
			color: red;
			font-weight: bold;
			margin-bottom: 15px;
		}
	</style>
</head>

<!-- ボディ-->
 <body>
    <center>
        <div class="container">
            <h1>Scot Medal Park</h1>
			
			<div th:if="${error}" class="error-message">
                <span th:text="${error}">エラーメッセージが入ります</span>
            </div>
			
            <form action="/login" method="post">
				<p class="formtext">ログインID</p>
                <input type="text" name="loginID" class="textbox" required placeholder="">
				<p class="formtext">パスワード</p><input type="password" name="loginPass" class="textbox" required placeholder="">
                <br><button type="submit" class="button-login" >ログイン</button>
            </form>
			<br><a th:href="@{/register}">
				<button class="button-newlogin">新規登録</button>
			</a>
        </div>
    </center>
 </body>
