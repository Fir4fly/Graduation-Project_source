<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>ACHIEVEMENTS</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #c9f2b3;
    }
    .container {
      padding: 20px;
    }
    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .title {
		color: #b8f3f6;
      	font-size: 28px;
      	font-weight: bold;
		-webkit-text-stroke: 1px black;
    }
    .profile-button {
      padding: 6px 16px;
      border-radius: 20px;
      border: 2px solid #000;
      background: #b8f3f6;
      cursor: pointer;
    }
	.profile-button:hover {
		background-color: rgb(0, 128, 255); 
        color: whitesmoke; 
        transform: translateY(-2px); 
        box-shadow: 0 0 10px rgb(0, 128, 255); 
    }
    /* Navigation */
    .nav {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }
	.nav a{
		flex: 1;
		display: flex;
	}
    .nav button {
      flex: 1;
      padding: 10px 0;
      border-radius: 20px;
      background: #b8f3f6;
      font-size: 16px;
      cursor: pointer;
    }
	.nav button:hover{
		background-color: rgb(0, 128, 255); 
        color: whitesmoke; 
        transform: translateY(-2px); 
        box-shadow: 0 0 10px rgb(0, 128, 255); 
	}
    /* Main layout */
    .main {
      display: flex;
      gap: 20px;
    }
    /* Left panel */
    .left {
      width: 35%;
      background: #b8f3f6;
      border: 3px solid #000;
      border-radius: 12px;
      padding: 15px;
    }
    .stats {
      margin-bottom: 15px;
    }
    .stats div {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #000;
      padding: 6px 0;
      font-size: 14px;
    }
    .game-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 14px;
    }
    .game-table th,
    .game-table td {
      border-bottom: 1px solid #000;
      padding: 8px 4px;
      text-align: center;
    }
    .game-table th {
      font-weight: bold;
    }
    /* Right panel */
    .right {
      flex: 1;
      background: #b8f3f6;
      border-radius: 12px;
      padding: 15px;
    }
    .chart-title {
      text-align: center;
      font-size: 18px;
      margin-bottom: 10px;
    }
    .chart-mock {
      height: 320px;
      border-left: 2px solid #000;
      border-bottom: 2px solid #000;
      position: relative;
      padding: 10px;
    }
    .chart-note {
      position: absolute;
      bottom: 0;
      right: 10px;
      font-size: 12px;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title">ACHIEVEMENTS</div>
	  <div th:insert="fragments/profile :: profileModal"></div>
	  <button onclick="openProfile()" class="profile-button">PROFILE</button>
    </div>

    <div class="nav">
	  <a th:href="@{/home}">
			<button>HOME</button>
	  </a>
	  <a th:href="@{/gamelist}">
      		<button>GAME LIST</button>
	  </a>
	  <a th:href="@{/shop}">
      		<button>SHOP</button>
	  </a>
	  <a th:href="@{/ranking}">
      		<button>RANKING</button>
	  </a>
    </div>

    <div class="main">
      <!-- Left -->
      <div class="left">
        <div class="stats">
          <div>
			<span>総プレイ数</span>
			<span th:text="${#numbers.formatInteger(hlPlayCount, 1, 'COMMA')}">750</span>
		</div>
          <div>
			<span>総メダル獲得数</span>
			<span th:text="${#numbers.formatInteger(hlGetMedal, 1, 'COMMA')}">15,500</span>
		</div>
          <div>
			<span>総メダル消費数</span>
			<span th:text="${#numbers.formatInteger(hlBetMedal, 1, 'COMMA')}">8,700</span>
		</div>
          <div>
			<span>現在の所持メダル</span>
			<span th:text="${#numbers.formatInteger(myMedals, 1, 'COMMA')}">10,000</span>
		</div>
        </div>

        <table class="game-table">
          <thead>
            <tr>
              <th>ゲーム</th>
              <th>プレイ数</th>
              <th>獲得数</th>
            </tr>
          </thead>
          <tbody>
            <tr>
				<td>High & Low</td>
				<td th:text="${#numbers.formatInteger(hlPlayCount, 1, 'COMMA')}">300</td>
				<td th:text="${#numbers.formatInteger(hlGetMedal, 1, 'COMMA')}">5,000</td>
			</tr>
            <tr><td>Poker</td><td>0</td><td>0</td></tr>
            <tr><td>Black Jack</td><td>0</td><td>0</td></tr>
            <tr><td>Roulette</td><td>0</td><td>0</td></tr>
          </tbody>
        </table>
      </div>

      <!-- Right -->
      <div class="right">
        <div class="chart-title">所持メダル　推移</div>
        <div class="chart-mock">
          <!-- グラフはモック（枠のみ） -->
          <div class="chart-note">※ グラフ表示（モック）</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
