<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking</title>
    <style>
		/* --- 全体設定 --- */
		body {
		    background-color: #c9f2b3;
		    color: whitesmoke;
		    font-family: Arial, Helvetica, sans-serif;
		    padding: 0;
		    display: flex;
		    justify-content: center;
		    align-items: flex-start;
		    min-height: 100vh;
		}

		/* コンテナ：スマホでは全幅、PCでは最大700pxまで広がる */
		.ranking-container {
		    width: 100%;
		    max-width: 700px; /* ここを広げてPC対応 */
		    background-color: lightgreen;
		    border: 2px solid rgb(0, 128, 255);
		    box-shadow: 0 0 15px rgba(0, 128, 255, 0.4);
		    padding: 15px;
		    box-sizing: border-box;
		    margin: 20px;
		}

		/* ヘッダー */
		.header {
		    display: flex;
		    justify-content: space-between;
		    align-items: center;
		    padding: 10px 0;
		    border-bottom: 3px solid royalblue;
		}

		.header h1 {
		    font-size: clamp(28px, 5vw, 40px); /* 可変フォント */
		    font-weight: bold;
		    margin: 0;
		    letter-spacing: 2px;
		    -webkit-text-stroke: 1.3px royalblue;
		}

		.profile-btn {
		    background-color: #b8f3f6;
		    color: black;
		    border: 2px solid black;
		    padding: 8px 20px;
		    font-weight: bold;
		    cursor: pointer;
		    border-radius: 20px;
		    transition: all 0.3s ease;
		}

		.profile-btn:hover {
		    background-color: rgb(0, 128, 255); 
		    color: whitesmoke; 
		    box-shadow: 0 0 10px rgb(0, 128, 255); 
		}

		/* メニューボタン */
		.menu-grid {
		    display: grid;
		    grid-template-columns: 1fr 1fr; /* PCでも2列（4ボタンなら2x2が綺麗） */
		    gap: 12px; 
		    margin: 15px 0;
		}

		.menu-grid button {
		    width: 100%;
		    height: 45px;
		    background-color: #b8f3f6;
		    color: black;
		    border: 2px solid black;
		    font-weight: bold;
		    cursor: pointer;
		    border-radius: 20px;
		    transition: all 0.3s ease;
		}

		.menu-grid button:hover {
		    background-color: rgb(0, 128, 255); 
		    color: whitesmoke; 
		    transform: translateY(-2px);
		    box-shadow: 0 0 10px rgb(0, 128, 255);
		}

		/* メダル情報 */
		.medal-info {
		    background-color: #b8f3f6;
		    color: black;
		    border: 2px solid black;
		    margin-top: 15px;
		    padding: 12px 20px;
		    border-radius: 10px;
		}

		.medal-row {
		    display: flex;
		    justify-content: space-between;
		    font-size: 18px;
		    font-weight: bold;
		}

		/* 自分のランキング (固定表示) */
		.my-ranking {
		    color: black;
		    margin: 15px 0;
		    border: 3px solid royalblue;
		    border-radius: 10px;
		    background-color: rgba(255, 255, 255, 0.3);
		}

		/* ランキングテーブル共通設定 */
		.ranking-table {
		    margin-top: 10px;
		}

		.ranking-header {
		    display: flex;
		    justify-content: space-between;
		    align-items: center;
		    padding: 10px 0;
		    font-size: 26px;
		    font-weight: bold;
		    -webkit-text-stroke: 1px royalblue;
		}

		/* ランキングリスト (スクロール領域) */
		.ranking-list {
		    color: black;
		    border: 2px solid royalblue;
		    border-radius: 10px;
		    background-color: rgba(255, 255, 255, 0.5);
		    max-height: 400px; /* PC向けに少し高く */
		    overflow-y: auto;
		}

		/* スクロールバーのデザイン（非表示にしない設定） */
		.ranking-list::-webkit-scrollbar {
		    width: 8px;
		}
		.ranking-list::-webkit-scrollbar-thumb {
		    background: royalblue;
		    border-radius: 10px;
		}

		.ranking-row {
		    display: flex;
		    border-bottom: 1px solid rgba(65, 105, 225, 0.3);
		    font-size: 18px;
		}

		.ranking-row.is-me {
		    background-color: #b8f3f6;
		    font-weight: bold;
		}

		.ranking-row > div {
		    padding: 15px 10px;
		    display: flex;
		    align-items: center;
		    justify-content: center;
		}

		.rank-col { width: 15%; font-weight: bold; border-right: 1px solid rgba(65, 105, 225, 0.2); }
		.name-col { width: 50%; justify-content: flex-start !important; padding-left: 20px !important; border-right: 1px solid rgba(65, 105, 225, 0.2); }
		.medals-col { width: 35%; }

		/* --- PC用メディアクエリ (幅600px以上) --- */
		@media (min-width: 600px) {
		    .ranking-container {
		        padding: 30px;
		    }
		    
		    .menu-grid {
		        grid-template-columns: repeat(4, 1fr); /* PCではボタンを横4つ並びにする */
		        gap: 15px;
		    }

		    .ranking-list {
		        max-height: 550px; /* PCではより多くの順位を一度に見せる */
		    }

		    .ranking-row {
		        font-size: 20px; /* 文字を少し大きく */
		    }
		}
    </style>
</head>
<body>

<div class="ranking-container">
    
    <div class="header">
        <h1>RANKING</h1>
		<div th:insert="fragments/profile :: profileModal"></div>
		<button class="profile-btn" onclick="openProfile()">PROFILE</button>
    </div>

    <div class="menu-grid">
		<a th:href="@{/home}">
			<button class="home-button">HOME</button>				
		</a>
		<a th:href="@{/gamelist}">
			<button class="gamelist-button">GAME LIST</button>
		</a>
		<a th:href="@{/shop}">
			<button class="shop-button">SHOP</button>				
		</a>
		<a th:href="@{/achievements}">
			<button class="achievements-button">ACHIEVEMENTS</button>			
		</a>
    </div>

	<div class="medal-info">
		<div class="medal-row">
			<span>My Medals</span>
			<span th:text="${#numbers.formatDecimal(myMedals, 0, 'COMMA', 0, 'POINT')} + ' 枚'">1000 </span>
        </div>
	</div>
	
	<div class="my-ranking" th:if="${myRankingInfo != null}">
		<div class="ranking-row">
            <div class="rank-col" th:text="${myRankingInfo.rank}">10</div>
            <div class="name-col" th:text="${myRankingInfo.nickname}">Me</div>
            <div class="medals-col user-medals" th:text="${#numbers.formatDecimal(myRankingInfo.medals, 0, 'COMMA', 0, 'POINT')} + ' 枚'">2000 $</div>
        </div>
    </div>
	    
    <div class="ranking-table">
        <div class="ranking-header">
            <span class="arrow" role="button" aria-label="Previous Ranking">◀</span>
            <span>My Medal Rank</span>
            <span class="arrow" role="button" aria-label="Next Ranking">▶</span>
        </div>

        <div class="ranking-list">
            <div class="ranking-row" th:each="userRank : ${rankingList}" 
                 th:classappend="${userRank.isMe()} ? 'is-me' : ''">
				 <div class="rank-col" th:text="${userRank.rank}">1</div>
				 <div class="name-col" th:text="${userRank.nickname}">user1</div>
				 <div class="medals-col user-medals" th:text="${#numbers.formatDecimal(userRank.medals, 0, 'COMMA', 0, 'POINT')} + ' 枚'"></div>
			</div>
        </div>
    </div>
</div>

</body>
</html>
