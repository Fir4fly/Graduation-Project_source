<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>High & Low</title>
    <style>
        /* ここに提供された画像に合わせた簡易的なスタイルを記述します */
        body {
            background-color: rgb(189, 244, 189); /* イメージ図の背景色に近い緑 */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .container {
            width: 800px;
            padding: 30px;
            border: 5px solid #ff9800; /* オレンジ色の枠線 */
            border-radius: 10px;
            background-color: rgb(57, 198, 166);
            display: grid;
            grid-template-areas:
                "home bet reset medal"
                "card1 card2 high low"
                "card1 card2 high low"
                "bet1 bet5 bet10 bet50";
            grid-template-columns: 1fr 1fr 150px 150px;
            grid-template-rows: auto auto auto 80px;
            gap: 20px;
            align-items: center;
            justify-items: center;
        }
        .home-btn {
            grid-area: home;
			font-size: 20px;
            justify-self: start;
            padding: 15px 30px;
            background-color: #b8f3f6; 
            color: black;
            border: 1px solid black;
            cursor: pointer;
			margin-top: -30px;
			margin-left: -30px;
        }
		.home-btn:hover{
			background-color: rgb(0, 128, 255); 
            color: whitesmoke; 
            box-shadow: 0 0 10px rgb(0, 128, 255); 
		}
        .bet-count {
            grid-area: bet;
            background-color: black;
            color: white;
            padding: 15px 30px;
            border-radius: 5px;
            font-size: 24px;
        }
        .reset-btn {
            grid-area: reset;
            background-color: #d32f2f; /* 赤系のボタン */
            color: white;
            padding: 10px 20px;
            cursor: pointer;
        }
        .medal-count {
            grid-area: medal;
			background-color: white;
            padding: 10px;
            border: 4px solid black;
            font-size: 18px;
        }
		.card {
			width: 90%;
			aspect-ratio: 2 / 3;
			overflow: hidden; /* 画像が枠を超えるのを防ぐ */
		}
        .card1 { grid-area: card1; }
        .card2 { grid-area: card2; }
        .high-btn, .low-btn {
            background-color: #b8f3f6;
            color:black;
            font-size: 24px;
			font-weight: bold;
            padding: 20px;
            width: 100%;
			border: 3px solid royalblue;
            cursor: pointer;
        }
        .high-btn { grid-area: high; }
        .low-btn { grid-area: low; }
		.high-btn:hover{
			background-color: rgb(0, 128, 255); 
            color: whitesmoke; 
            box-shadow: 0 0 10px rgb(0, 128, 255); 
		}
		.low-btn:hover{
			background-color: rgb(0, 128, 255); 
            color: whitesmoke; 
            box-shadow: 0 0 10px rgb(0, 128, 255); 
		}
		
        .bet-btn {
            background-color: #b8f3f6;
            color: black;
			text-align: center;
            font-size: 18px;
			font-weight: bold;
            padding: 15px 30px;
            width: 100%;
            cursor: pointer;
            border: none;
        }
		.bet-btn:hover{
			background-color: rgb(0, 128, 255); 
            color: whitesmoke; 
            box-shadow: 0 0 10px rgb(0, 128, 255); 
		}
        .bet1-btn { grid-area: bet1; }
        .bet5-btn { grid-area: bet5; }
        .bet10-btn { grid-area: bet10; }
        .bet50-btn { grid-area: bet50; }
        /* ゲーム結果メッセージ用のスタイル (任意) */
        .message {
            grid-column: 1 / span 4;
            text-align: center;
            color: yellow;
            font-size: 20px;
        }
		
		/* -------- popup -------- */
		.popup {
		    position:absolute;
		    bottom:0;
		    left:0;
		    width:100%;
		    background:rgba(0,0,0,0.8);
		    color:white;
		    padding:20px;
		    text-align:center;
		}

		.popup-content {
		    margin:auto;
		    font-size:22px;
		}

		.popup button {
		    margin-top:10px;
		    padding:10px 20px;
		    font-size:20px;
		    cursor:pointer;
		}

    </style>
</head>
<body>
    <div class="container">
        <form th:action="@{/home}" method="get">
            <button type="submit" class="home-btn">HOME</button>
        </form>

        <div class="bet-count">
            <span th:text="${betCount}" id="HLBetMedal">0</span> </div>

        <button type="button" class="reset-btn" onclick="resetBet()">RESET</button>

        <div class="medal-count">
            所持メダル数: <span th:text="${user.myMedal}" id="Mymedal">5000</span> </div>

			<div class="card card1">
				<img id="faceUpCardImage" th:src="@{'/images/cards/' + ${faceUpCard} + '.png'}" 
			    	alt="表向きのカード" style="width: 100%; height: 100%; object-fit: contain;">
			</div>

			<div class="card card2">
				<img id="faceDownCardImage" th:src="@{/images/cards/back.png}" 
			    	alt="裏向きのカード" style="width: 100%; height: 100%; object-fit: contain;">
			</div>
			
        <button type="button" class="high-btn" onclick="placeBet('HIGH')">HIGH</button>

        <button type="button" class="low-btn" onclick="placeBet('LOW')">LOW</button>
		
		<!-- ★ ポップアップ（結果表示） -->
		<div id="resultPopup" class="popup" style="display:none;">
		    <div class="popup-content">
		        <p id="popupResult"></p>
		        <p id="popupCards"></p>
		        <button onclick="closePopup()">NEXT</button>
		    </div>
		</div>


        <div class="message" id="game-message"></div>

        <button type="button" class="bet-btn bet1-btn" onclick="addBet(1)">1BET</button>

        <button type="button" class="bet-btn bet5-btn" onclick="addBet(5)">5BET</button>

        <button type="button" class="bet-btn bet10-btn" onclick="addBet(10)">10BET</button>

        <button type="button" class="bet-btn bet50-btn" onclick="addBet(50)">50BET</button>
    </div>

	<script>
	    const betCountElement = document.getElementById('HLBetMedal');
	    const myMedalElement = document.getElementById('Mymedal');
	    const gameMessage = document.getElementById('game-message');

	    let currentBet = parseInt(betCountElement.textContent);
	    let currentMedal = parseInt(myMedalElement.textContent);

		/*
		window.onload = () => {
			document.querySelector('.card1 span').textContent =
		    	document.getElementById("faceUpCard").textContent;

		    document.querySelector('.card2 span').textContent =
		        document.getElementById("faceDownCard").textContent;
		};
		*/
		
		function getCardImagePath(cardValue) {
			        if (cardValue === '?' || !cardValue) {
			            return '/images/cards/back.png';
			        }
			        return `/images/cards/${cardValue}.png`;
			    }
			
	    function updateBetDisplay() {
	        betCountElement.textContent = currentBet;
	    }

	    function addBet(amount) {
	        currentMedal = parseInt(myMedalElement.textContent); // 最新のメダル数
	        if (currentBet + amount > 999) {
	            gameMessage.textContent = 'ベットは999枚までです。';
	            return;
	        }
	        if (currentBet + amount > currentMedal) {
	            gameMessage.textContent = '所持メダル数を超えてベットできません。';
	            return;
	        }
	        currentBet += amount;
	        updateBetDisplay();
	        gameMessage.textContent = '';
	    }

	    function resetBet() {
	        currentBet = 0;
	        updateBetDisplay();
	        gameMessage.textContent = '';
	    }

	    // 🎮 HIGH / LOW ボタン押下
	    function placeBet(choice) {
	        if (currentBet <= 0) {
	            gameMessage.textContent = 'ベット数が0枚です。';
	            return;
	        }

	        // Controller へ送信する JSON
	        const requestBody = {
	            betAmount: currentBet,
	            choice: choice
	        };

	        fetch('/api/highlow/play', {
	            method: 'POST',
	            headers: { 'Content-Type': 'application/json' },
	            body: JSON.stringify(requestBody)
	        })
	        .then(res => {
	            if (!res.ok) {
	                throw new Error("サーバーエラー");
	            }
	            return res.json();
	        })
			.then(data => {
				// ★★★ 認証エラーチェック ★★★
                if (data.result === "UNAUTHORIZED") {
                    gameMessage.textContent = 'セッションが切れました。ログインページへ移動します。';
                    alert("認証情報が見つかりません。再度ログインしてください。");
                    // ログインページへリダイレクト
                    window.location.href = "/login";
                    return; // 以降の処理を中断
                }
				
				const faceDownCardImage = document.getElementById("faceDownCardImage");

			    // ★ 裏向きカードをひっくり返す
			    //document.querySelector('.card2 span').textContent = data.newCard;
				faceDownCardImage.src = `/images/cards/${data.newCard}.png`;

			    // ★ 結果をポップアップに表示
			    const popup = document.getElementById("resultPopup");
			    document.getElementById("popupResult").textContent =
			        (data.result === "WIN")
			            ? `WIN！！ +${data.medalChange} メダル`
			            : `LOSE... ${data.medalChange} メダル`;

			    document.getElementById("popupCards").textContent =
			        `表:${data.faceUpCard}  裏:${data.newCard}`;

			    popup.style.display = "block";

			    myMedalElement.textContent = data.newMedal;

			    currentBet = 0;
			    updateBetDisplay();
			})

	        .catch(error => {
	            console.error("通信エラー:", error);
	            gameMessage.textContent = '通信中にエラーが発生しました。';
	        });
	    }
		
		function closePopup() {
		    document.getElementById("resultPopup").style.display = "none";
			const faceUpCardImage = document.getElementById("faceUpCardImage");
			const faceDownCardImage = document.getElementById("faceDownCardImage");

		    // ★ 新しい表向きカードをリクエスト（APIで再生成する）
		    fetch('/api/highlow/newgame')
		        .then(res => res.json())
		        .then(data => {
		            //document.querySelector('.card1 span').textContent = data.faceUpCard;
		            //document.querySelector('.card2 span').textContent = "?";
					faceUpCardImage.src = `/images/cards/${data.faceUpCard}.png`;
					faceDownCardImage.src = `/images/cards/back.png`;
		        });
		}

	</script>

</body>
</html>
