<!-- fragments/profile.html -->
<div th:fragment="profileModal">
	<style>
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6);
        }
        .modal-content {
            background: rgb(192, 192, 192);
			color: black;
            width: 400px;
            padding: 20px;
            margin: 10% auto;
            border-radius: 10px;
        }
        .close {
            cursor: pointer;
            float: right;
        }
		.logout-button{
			background-color: red;
			color: white;
			border: 1px solid black;
			padding: 10px 15px;
			border-radius: 5px;
		}
		.logout-button:hover{
			background-color: white;
			color: red;
		}
    </style>
		
    <div id="profileModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeProfile()">&times;</span>

            <h2>プロフィール</h2>

            <div>
                <p>ユーザー名:<span th:text="${nickname}"></span></p>
                <p>メダル:<span id="profileMedal" th:text="${myMedals}"></span></p>
            </div>
			
			<form th:action="@{/logout}" method="post" style="margin-top: 20px;">
                <button class="logout-button" type="submit">
                    ログアウト
                </button>
            </form>
			
			<hr>
			<form th:action="@{/profile/update-nickname}" method="post">
                <h3>ニックネーム変更</h3>
                <div>
                    <label for="newNickname">新しいニックネーム:</label>
                    <input type="text" id="newNickname" name="newNickname" 
                           th:value="${nickname}" required>
                </div>
                <button type="submit" style="margin-top: 10px;">更新</button>
            </form>
            
            <div th:if="${updateSuccess}">
                <p style="color: green;">ニックネームが更新されました。</p>
            </div>
            <div th:if="${updateError}">
                <p style="color: red;" th:text="${updateError}"></p>
            </div>

        </div>
    </div>

    <script>
		function formatNumber(num) {
	        return Number(num).toLocaleString();
	    }

	    function openProfile() {
	        const medalElement = document.getElementById('profileMedal');

	        if (medalElement) {
	            const medal = parseInt(
	                medalElement.textContent.replace(/,/g, '')
	            );
	            medalElement.textContent = formatNumber(medal);
	        }

	        document.getElementById('profileModal').style.display = 'block';
	    }

	    function closeProfile() {
	        document.getElementById('profileModal').style.display = 'none';
	    }
    </script>
</div>
