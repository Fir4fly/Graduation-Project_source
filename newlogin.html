<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- ヘッダー -->
	<head>
		<meta charset="UTF-8">
	    <title>新規登録</title>
		<style>
			body{
				background-color: #c9f2b3;
				color: gray;
			}
	
			h1{
				color: #b8f3f6;
			    text-shadow: 0 0 10px rgba(0, 128, 255, 0.8);
				font-size: 48px;
				-webkit-text-stroke: 1.5px black;
			}
			.form{
				display: flex;
				flex-direction: column;
			}
			
			.formtext{
				color: black;
				margin-right: 240px;
				margin-bottom: 6px;
			}
			
			.formtext-kakunin{
				color: black;
				margin-right: 195px;
				margin-bottom: 6px;
			}
	
			.textbox{
				background-color: #b8f3f6;
			    border: 1px solid black;
			    color: black;
			    padding: 10px;
			    font-size: 16px;
			    border-radius: 5px;
			    width: 300px;
			    text-align: center;
			    outline: none;
			    margin-bottom: 10px;
			}
	
			.button-newlogin {
				width: 100px;
				background-color: lightcoral;
				color: black;
				border: 1px solid black;
				padding: 5px 10px;
				margin-top: 15px;
				font-weight: bold;
				cursor: pointer;
				transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
	            /* 修正点1: 枠線に丸みを持たせる */
	            border-radius: 8px;
			}
			.button-newlogin:hover {
				background-color: orangered; 
	            color: whitesmoke; 
	            transform: translateY(-2px); 
	            box-shadow: 0 0 10px orangered;
			}
	
			.margin {
			    margin-top: 15px;
			}
			
			.error-message {
                color: red;
                font-weight: bold;
                margin-bottom: 15px;
            }
		</style>
	</head>
	
	<!-- ボディ-->
	 <body>
	    <center>
	        <div class="container">
	            <h1>Scot Medal Park</h1>
				<div th:if="${error}" class="error-message">
					<p th:text="${error}"></p>
				</div>
	            <form th:action="@{/register}" th:method="post" th:object="${user}">
					<p class="formtext">ログインID</p>
	                <input type="text" name="loginID" class="textbox" required placeholder="" th:field="*{loginID}">
					
					<p class="formtext">ユーザー名</p>
					<input type="text" name="nickname" class="textbox" required placeholder="" th:field="*{nickname}">
					
					<p class="formtext">パスワード</p>
	                <input type="password" name="loginPass" class="textbox" required placeholder="" th:field="*{loginPass}">
					
					<p class="formtext-kakunin">確認用パスワード</p>
					<input type="password" name="confPass" class="textbox" required placeholder="">
	                <br><input type="submit" value="登録" class="button-newlogin" >
	            </form>
	        </div>
	    </center>
	 </body>
 </html>
